[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "autoresearch-v2"
version = "2.0.0"
description = "AutoResearch v2 (HRDE) — Self-Evolving ToM-Enhanced Autonomous Research Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AutoResearch v2 Contributors" }]
keywords = [
    "autonomous-research", "multi-agent", "theory-of-mind",
    "hyper-agent", "llm", "scientific-discovery",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "networkx>=3.0",
    "PyYAML>=6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
llm = ["litellm>=1.35.0"]
memory = ["chromadb>=0.4.0"]
science = ["numpy>=1.24.0", "scipy>=1.10.0", "scikit-learn>=1.3.0"]
plot = ["matplotlib>=3.7.0"]
all = [
    "litellm>=1.35.0",
    "chromadb>=0.4.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[project.scripts]
autoresearch = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autoresearch_v2*"]

[tool.pytest.ini_options]
testpaths = ["autoresearch_v2/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"
